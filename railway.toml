[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.web"

[deploy]
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py init_superuser"
startCommand = "gunicorn querygrade.wsgi --log-file - --log-level info --bind 0.0.0.0:$PORT"
