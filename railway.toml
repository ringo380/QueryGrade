[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.web"

[deploy]
# Pre-deploy runs in a separate container, so collectstatic output wouldn't reach
# the runtime container. Keep migrate + init_superuser in pre-deploy (one-shot ops),
# and re-run collectstatic in startCommand so /app/staticfiles exists for whitenoise.
preDeployCommand = "sh -c 'python manage.py migrate --noinput && python manage.py init_superuser'"
startCommand = "sh -c 'python manage.py collectstatic --noinput && gunicorn querygrade.wsgi --log-file - --log-level info --bind 0.0.0.0:$PORT'"

# ---------------------------------------------------------------------------
# Sibling services (provisioned in the Railway dashboard, not via railway.toml):
#
#   querygrade-worker  - Dockerfile.worker - Celery worker, executes ML tasks
#   querygrade-beat    - Dockerfile.beat   - Celery beat, schedules monitor_ml_models
#                                            every 15 min (see querygrade/celery.py)
#
# BOTH ARE CURRENTLY STOPPED (issue #133). Their deployments were removed to
# save about $6.90/month while QueryGrade has no users; the service config is
# intact, so redeploying either brings it back as configured. While they are
# down, every async feature (log processing, batch analysis, schema analysis,
# report generation) is non-functional, and nothing consumes the Celery
# queues. Session retention still runs, from SessionPurgeMiddleware on this
# service. Restore both before QueryGrade takes real traffic.
#
# Both services share the same env vars as the web service (DATABASE_URL,
# REDIS_URL, etc.). Beat additionally needs ML_ALERT_RECIPIENTS once PR 3
# of the issue-#5 stack lands.
#
#   Redis    - image service, Celery broker + Django cache backend
#   Postgres - image service, application database
#
# Those two are image services with no repo source, so they have no config file
# here and their settings live only in the Railway dashboard. infra/railway-services.md
# is the record of what is set on them and why. Read it before changing either;
# Redis in particular carries a memory ceiling and an eviction policy whose
# failure modes are silent.
# ---------------------------------------------------------------------------
