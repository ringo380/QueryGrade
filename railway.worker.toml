# Per-service Railway config for the Celery worker (issue #5).
# Selected via the service's "Config File Path" = railway.worker.toml, which
# makes this service ignore the default railway.toml (that one is web-only and
# would otherwise force Dockerfile.web + a gunicorn start command).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.worker"

[deploy]
# No preDeployCommand: migrations + init_superuser are owned by the web service.
#
# --concurrency is pinned deliberately. Celery's prefork pool defaults to
# os.cpu_count(), which inside a Railway container reports the HOST's core
# count (48), not this container's share. That forked 48 children, each
# carrying its own dirtied copy of Django + pandas + scikit-learn +
# matplotlib, for ~4.4 GB resident at ~0.002 vCPU of actual work - $46/mo of
# a $60 Railway bill (issue #126). The real load is one monitor_ml_models
# task every 15 min plus occasional user-triggered ML tasks; 2 is generous.
#
# CELERY_WORKER_MAX_MEMORY_PER_CHILD does not substitute for this: prefork
# only checks a child for recycling after it FINISHES a task, so idle
# children are never reclaimed.
# -Q must list every queue in settings.CELERY_TASK_ROUTES plus the default
# `celery` queue. Without it the worker consumed only `celery`, so the five
# routed tasks (log processing, batch analysis, schema analysis, reports,
# temp-file cleanup) were accepted, written to Redis, and never executed.
# Only monitor_ml_models ran, because it is the one task with no route.
startCommand = "celery -A querygrade worker --loglevel=info --concurrency=2 -Q celery,heavy_processing,light_processing,maintenance"
